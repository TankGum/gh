services:
  frontend:
    image: node:20-alpine
    container_name: goodhair_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3002:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true # Giúp hot-reload hoạt động trên Docker
    env_file:
      - .env.local
    # Dành cho Linux để truy cập host thông qua host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
