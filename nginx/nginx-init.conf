events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name goodhair.site www.goodhair.site api.goodhair.site;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 200 'Initializing SSL...';
            add_header Content-Type text/plain;
        }
    }
}
