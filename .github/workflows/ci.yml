name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

jobs:
  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: goodhair_frontend/package-lock.json

      - name: Install dependencies
        working-directory: goodhair_frontend
        run: npm ci

      - name: Build
        working-directory: goodhair_frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://api.goodhair.site/api/v1
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
