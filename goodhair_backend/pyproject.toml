[tool.poetry]
name = "goodhair-backend"
version = "0.1.0"
description = "GoodHair backend service"
authors = ["GoodHair Team <dev@goodhair.local>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
alembic = "^1.13.2"
apscheduler = "^3.10.4"
asyncpg = "^0.29.0"
fastapi = "^0.111.0"
email-validator = "^2.2.0"
loguru = "^0.7.2"
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
pydantic = "^2.8.2"
pydantic-settings = "^2.3.4"
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
python-multipart = "^0.0.9"
sqlalchemy = "^2.0.31"
uvicorn = { extras = ["standard"], version = "^0.30.1" }
cloudinary = "^1.44.2"
google-auth = "^2.55.0"
requests = "^2.34.2"
cryptography = "^43.0.0"

[tool.poetry.group.dev.dependencies]
httpx = "^0.27.0"
mypy = "^1.10.1"
pre-commit = "^3.7.1"
pytest = "^8.2.2"
pytest-asyncio = "^0.23.7"
ruff = "^0.5.0"
testcontainers = { extras = ["postgres"], version = "^4.7.2" }

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "ASYNC"]
ignore = ["ANN101", "ANN102"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection helpers are called in argument defaults by design.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Cookie",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Form",
    "fastapi.File",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
